name: Yolculuk
options:
  bundleIdPrefix: de.fatih
  deploymentTarget:
    iOS: "16.0"

targets:
  Yolculuk:
    type: application
    platform: iOS
    sources:
      - path: ios-native/Yolculuk
        excludes:
          - Assets.xcassets
      - path: index.html
        buildPhase: resources
      - path: fuel-prices.json
        buildPhase: resources
      - path: fuel-widget.js
        buildPhase: resources
      - path: manifest.json
        buildPhase: resources
      - path: route-fix-widget.js
        buildPhase: resources
      - path: sw.js
        buildPhase: resources
      - path: task-links.js
        buildPhase: resources
      - path: vignette-widget.js
        buildPhase: resources
      - path: ios-native/Yolculuk/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fatih.yolculuk
        PRODUCT_NAME: Yolculuk
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ios-native/Yolculuk/Info.plist
      properties:
        CFBundleDisplayName: DE-TR Yolculuk
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
